app-id: br.com.erlondnjr.rustzap
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: rustzap
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=host:ro
modules:
  - name: rustzap
    buildsystem: simple
    build-commands:
      - install -Dm755 rustzap /app/bin/rustzap
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/br.com.erlondnjr.rustzap.png
      - install -Dm644 br.com.erlondnjr.rustzap.desktop /app/share/applications/br.com.erlondnjr.rustzap.desktop
      - install -Dm644 br.com.erlondnjr.rustzap.metainfo.xml /app/share/metainfo/br.com.erlondnjr.rustzap.metainfo.xml
    sources:
      - type: dir
        path: build/files